[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderwitness"
version = "0.1.0"
description = "Turn order-dependent pytest failures into a verified polluter -> victim witness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["pytest", "flaky", "test-order", "delta-debugging", "test-isolation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orderwitness = "orderwitness.__main__:main"

[tool.setuptools.packages.find]
include = ["orderwitness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]